<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
  role="img"
  aria-label="Game Time"
>
  <title>Game Time</title>
  <defs>
    <linearGradient id="gt-disc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="48%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Fond transparent : la médaille sert de silhouette. Le cerne extérieur
       la détache des barres d'onglets claires. -->
  <circle cx="256" cy="256" r="236" fill="url(#gt-disc)" />
  <circle
    cx="256"
    cy="256"
    r="230"
    fill="none"
    stroke="#a35a06"
    stroke-opacity="0.55"
    stroke-width="12"
  />
  <circle
    cx="256"
    cy="256"
    r="203"
    fill="none"
    stroke="#92400e"
    stroke-opacity="0.28"
    stroke-width="12"
  />

  <!-- « G » géométrique : anneau ouvert en haut à droite + barre médiane -->
  <path
    d="M324.3 158.5 A119 119 0 1 0 375 256 L281 256"
    fill="none"
    stroke="#2a1c05"
    stroke-width="43"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
