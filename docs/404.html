      html,

      }

      #app-shell-loader {
        position: fixed;
        inset: 0;
        background: light-dark(#fbf7ef, #12100b);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #app-shell-loader .loader-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #app-shell-loader .loader-clip {
        overflow: hidden;
        padding: 3px 0;
      }

      #app-shell-loader .loader-word-game {
        display: block;
        font-family: Roboto, "Helvetica Neue", sans-serif;
        font-weight: 500;
        font-size: 18px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: light-dark(#1c1710, #f7f1e6);
        text-align: center;
        animation: loader-rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
      }

      #app-shell-loader .loader-word-time {
        display: block;
        font-family: Roboto, "Helvetica Neue", sans-serif;
        font-weight: 500;
        font-size: 40px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: light-dark(#b45309, #fcd34d);
        text-align: center;
        animation: loader-rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both;
      }

      #app-shell-loader .loader-line-wrap {
        margin-top: 10px;
        height: 4px;
        width: 100px;
        background: light-dark(rgba(180, 83, 9, 0.18), rgba(251, 191, 36, 0.2));
        border-radius: 2px;
        overflow: hidden;
        animation: loader-fadein 0.4s ease 0.8s both;
      }

      #app-shell-loader .loader-line-fill {
        height: 100%;
        width: 40%;
        background: linear-gradient(
          90deg,
          light-dark(#b45309, #d97706),
          light-dark(#d97706, #fbbf24)
        );
        border-radius: 2px;
        animation: loader-ping 1.4s ease-in-out 0.9s infinite;
      }

      @keyframes loader-rise {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes loader-fadein {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes loader-ping {
        0% {
          transform: translateX(-100%);
        }
        50%,
        100% {
          transform: translateX(250%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-shell-loader *,
        #app-shell-loader *::before {
          animation: none !important;
        }
      }
