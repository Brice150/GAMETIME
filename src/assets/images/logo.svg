<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
  role="img"
  aria-label="Game Time"
>
  <title>Game Time</title>
  <defs>
    <linearGradient id="gt-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1509" />
      <stop offset="100%" stop-color="#12100b" />
    </linearGradient>
    <linearGradient id="gt-disc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="48%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="gt-tail-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="gt-tail-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#gt-bg)" />

  <!-- Rubans -->
  <path d="M172 250 H252 V402 L212 366 172 402 Z" fill="url(#gt-tail-left)" />
  <path d="M260 250 H340 V402 L300 366 260 402 Z" fill="url(#gt-tail-right)" />

  <!-- Médaille -->
  <circle cx="256" cy="200" r="92" fill="url(#gt-disc)" />
  <circle
    cx="256"
    cy="200"
    r="78"
    fill="none"
    stroke="#92400e"
    stroke-opacity="0.28"
    stroke-width="5"
  />

  <!-- « G » géométrique : anneau ouvert en haut à droite + barre médiane -->
  <path
    d="M282.4 162.3 A46 46 0 1 0 302 200 L266 200"
    fill="none"
    stroke="#2a1c05"
    stroke-width="17"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
