<span class="title">{{ heading() }}</span>
@for (group of groups(); track $index) {
  <div class="vote-group">
    @if (group.label) {
      <span class="group-label">{{ group.label }}</span>
    }
    <div class="vote-options">
      @for (option of group.options; track option.key) {
        <button
          type="button"
          class="vote-option"
          [class.selected]="myVote() === option.key"
          [disabled]="!canVote()"
          [title]="option.label"
          (click)="vote(option.key)"
        >
          <i class="{{ option.icon }}"></i>
          <span class="label">{{ option.label }}</span>
          @if (voteCounts()[option.key]) {
            <span class="count">{{ voteCounts()[option.key] }}</span>
          }
        </button>
      }
    </div>
  </div>
}
<span class="vote-status">
  {{ votedCount() }} / {{ voters().length }}
  {{ voters().length > 1 ? "joueurs ont voté" : "joueur a voté" }}
</span>
