<section>
  @if (!loading()) {
    @if (room.isStarted) {
      @if (!isResultPageActive()) {
        <!-- Les joueurs ne sont pas forcement cote a cote : le chrono et le
        classement provisoire remplacent ce qu'ils voyaient de l'ecran voisin. -->
        <app-live-standings
          [room]="room"
          [players]="players"
          [currentPlayerId]="playerService.currentPlayerSig()!.userId"
        ></app-live-standings>
        <app-word-games
          [room]="room"
          [player]="playerService.currentPlayerSig()!"
          [lastRound]="lastRound()"
          (finishedStepEvent)="updatePlayerGame($event)"
          (progressEvent)="publishProgress($event)"
        ></app-word-games>
      } @else {
        <app-results-board
          [room]="room"
          [players]="players"
          [currentPlayerId]="playerService.currentPlayerSig()!.userId"
          [canVote]="true"
          (deleteEvent)="removePlayer($event)"
          (voteEvent)="vote($event)"
        ></app-results-board>
      }
    } @else {
      <app-waiting-room
        [room]="room"
        [player]="playerService.currentPlayerSig()!"
        [players]="players"
        (deleteEvent)="removePlayer($event)"
      ></app-waiting-room>
    }
    <div class="button-container">
      @if (!isFinishing()) {
        <button
          type="button"
          title="Quitter"
          (click)="openDialog()"
          class="delete"
        >
          <i class="bx bxs-log-out"></i>
          <span class="text">Quitter</span>
        </button>
      }
      @if (!room.isStarted || isResultPageActive()) {
        <button
          type="button"
          (click)="multiplayer()"
          title="Inviter"
          class="share"
        >
          <i class="bx bxs-user-plus"></i>
          <span class="text">Inviter</span>
        </button>
      }
      @if (shouldShowPlayButton()) {
        <button type="button" (click)="openDialogs()" title="Jouer">
          <i class="bx bx-play"></i>
          <span class="text">Jouer</span>
        </button>
      } @else if (shouldShowReadyButton()) {
        <button
          type="button"
          (click)="ready()"
          [title]="
            playerService.currentPlayerSig()!.isReady ? 'Pas prêt' : 'Prêt'
          "
          [ngClass]="{ delete: playerService.currentPlayerSig()!.isReady }"
        >
          @if (playerService.currentPlayerSig()!.isReady) {
            <i class="bx bxs-x-circle"></i>
            <span class="text">Pas prêt</span>
          } @else {
            <i class="bx bxs-check-circle"></i>
            <span class="text">Prêt</span>
          }
        </button>
      }
    </div>
  } @else {
    <mat-spinner></mat-spinner>
  }
</section>
