<div class="theme">
  <h2>Apparence</h2>

  <div class="gt-tabs" role="radiogroup" aria-label="Thème">
    @for (option of options; track option.value) {
      <button
        type="button"
        role="radio"
        [class.active]="themeService.mode() === option.value"
        [attr.aria-checked]="themeService.mode() === option.value"
        (click)="themeService.setMode(option.value)"
        [title]="option.label"
      >
        <i class="bx {{ option.icon }}" aria-hidden="true"></i>
        <span>{{ option.label }}</span>
      </button>
    }
  </div>

  <p class="hint">Système suit le réglage de votre appareil.</p>
</div>
